/* ---------------- building & sending requests ---------------- */
function hasHeader(headersObj, name) {
  return Object.keys(headersObj).some(k => k.toLowerCase() === name.toLowerCase());
}
function appendQueryParam(url, key, value) {
  const [base, qs, frag] = splitUrl(url);
  const pair = encodeURIComponent(key) + "=" + encodeURIComponent(value);
  return base + "?" + (qs ? qs + "&" : "") + pair + frag;
}

/**
 * Resolve a tab into a concrete request description (variables substituted,
 * auth applied). Shared by send + code generation.
 * Returns { url, method, headers: {k:v}, bodyKind, bodyText, formRows }
 */
function buildResolvedRequest(tab) {
  let url = substituteVars(tab.url.trim());
  if (url && !/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) url = "https://" + url;

  const headers = {};
  // merge duplicate rows (case-insensitive) instead of silently dropping all but the last
  const addHeader = (key, value) => {
    const existing = Object.keys(headers).find(k => k.toLowerCase() === key.toLowerCase());
    if (existing) headers[existing] += (existing.toLowerCase() === "cookie" ? "; " : ", ") + value;
    else headers[key] = value;
  };
  tab.headers.forEach(h => {
    if (h.enabled && h.key.trim()) addHeader(substituteVars(h.key.trim()), substituteVars(h.value));
  });

  const a = tab.auth || { type: "none" };
  if (a.type === "basic") {
    const cred = substituteVars(a.username || "") + ":" + substituteVars(a.password || "");
    // always UTF-8 encode so non-ASCII credentials match RFC 7617 expectations
    headers["Authorization"] = "Basic " + btoa(String.fromCharCode(...new TextEncoder().encode(cred)));
  } else if (a.type === "bearer") {
    headers["Authorization"] = "Bearer " + substituteVars(a.token || "");
  } else if (a.type === "apikey" && (a.key || a.value)) {
    if ((a.addTo || "header") === "query") {
      url = appendQueryParam(url, substituteVars(a.key || "key"), substituteVars(a.value || ""));
    } else {
      headers[substituteVars(a.key || "X-Api-Key")] = substituteVars(a.value || "");
    }
  }

  const method = tab.method;
  const canBody = !["GET", "HEAD"].includes(method) && tab.bodyType !== "none";
  let bodyKind = canBody ? tab.bodyType : "none";
  let bodyText = "";
  let formRows = [];

  if (bodyKind === "json" || bodyKind === "text" || bodyKind === "xml") {
    bodyText = substituteVars(tab.bodyContent);
    if (!bodyText.trim()) bodyKind = "none";
    else if (!hasHeader(headers, "content-type")) {
      headers["Content-Type"] = bodyKind === "json" ? "application/json"
        : bodyKind === "xml" ? "application/xml" : "text/plain";
    }
  } else if (bodyKind === "form" || bodyKind === "multipart") {
    formRows = (tab.formData || [])
      .filter(r => r.enabled && r.key.trim())
      .map(r => ({ key: substituteVars(r.key.trim()), value: substituteVars(r.value || ""), type: r.type || "text", _file: r._file || null }));
    if (!formRows.length) bodyKind = "none";
    else if (bodyKind === "form" && !hasHeader(headers, "content-type")) {
      headers["Content-Type"] = "application/x-www-form-urlencoded";
    } else if (bodyKind === "multipart") {
      // let the browser set the multipart boundary
      for (const k of Object.keys(headers)) {
        if (k.toLowerCase() === "content-type") delete headers[k];
      }
    }
  }
  return { url, method, headers, bodyKind, bodyText, formRows };
}

/* ---------------- native engine (Whisper desktop app) ---------------- */
// Inside the Whisper desktop app, requests are sent by the app's Rust core
// over Tauri IPC — no browser restrictions on hosts or headers. Opened as a
// plain file in a browser, the page falls back to fetch() ("browser mode").
function tauriCore() {
  const t = window.__TAURI__;
  return t && t.core && typeof t.core.invoke === "function" ? t.core : null;
}
const isNativeApp = () => !!tauriCore();

function updateEngineChip() {
  const native = isNativeApp();
  const chip = $("#engine-chip");
  chip.classList.toggle("native", native);
  $("#engine-label").textContent = native ? "Native engine — connected" : "Browser mode";
  chip.title = native
    ? "Requests are sent by the Whisper app itself, with every response header visible."
    : "This page is running directly in your browser, which may restrict some requests and hide some response headers. Use the Whisper desktop app for full functionality.";
}

function b64FromBytes(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// RFC 7578: percent-encode the characters that would break a quoted field name
const mpQuote = (str) => String(str).replace(/["\r\n]/g, (m) => encodeURIComponent(m));
// the browser's multipart serializer CRLF-normalizes names and text values first
const crlf = (str) => String(str).replace(/\r\n|\r|\n/g, "\r\n");

// Turn whatever fetch() would have sent into raw bytes for the native engine.
// Multipart bodies are assembled here, since there is no browser to do it.
async function bodyToBytes(body) {
  if (body == null) return { bytes: null, contentType: null };
  if (typeof body === "string") return { bytes: new TextEncoder().encode(body), contentType: null };
  if (body instanceof FormData) {
    const boundary = "----WhisperFormBoundary" + uid() + uid();
    const parts = [];
    for (const [name, value] of body.entries()) {
      parts.push(`--${boundary}\r\nContent-Disposition: form-data; name="${mpQuote(crlf(name))}"`);
      if (value instanceof Blob) {
        parts.push(`; filename="${mpQuote(value.name || "blob")}"\r\nContent-Type: ${value.type || "application/octet-stream"}\r\n\r\n`, value, "\r\n");
      } else {
        parts.push(`\r\n\r\n${crlf(value)}\r\n`);
      }
    }
    parts.push(`--${boundary}--\r\n`);
    const buf = await new Blob(parts).arrayBuffer();
    return { bytes: new Uint8Array(buf), contentType: "multipart/form-data; boundary=" + boundary };
  }
  const buf = await new Blob([body]).arrayBuffer();
  return { bytes: new Uint8Array(buf), contentType: null };
}

async function sendDirect(r, body, signal) {
  const res = await fetch(r.url, { method: r.method, headers: r.headers, body, signal, redirect: "follow" });
  const blob = await res.blob();
  return {
    status: res.status,
    statusText: res.statusText,
    headersList: Array.from(res.headers.entries()),
    finalUrl: res.url,
    redirected: res.redirected,
    contentType: res.headers.get("content-type") || "",
    blob,
  };
}

async function sendViaTauri(r, body, signal) {
  const core = tauriCore();
  const { bytes, contentType } = await bodyToBytes(body);
  const headers = Object.entries(r.headers);
  if (contentType && !hasHeader(r.headers, "content-type")) headers.push(["Content-Type", contentType]);
  if (signal.aborted) throw new Error("Request cancelled.");
  const id = uid();
  const onAbort = () => { core.invoke("cancel_request", { id }).catch(() => {}); };
  signal.addEventListener("abort", onAbort, { once: true });
  let buf;
  try {
    buf = await core.invoke("send_request", {
      meta: {
        id,
        url: r.url,
        method: r.method,
        headers,
        timeoutMs: Math.round(Math.max(0, (Number(state.settings.timeoutSec) || 0) * 1000)),
      },
      bodyB64: bytes ? b64FromBytes(bytes) : null,
    });
  } catch (e) {
    throw new Error(typeof e === "string" ? e : (e && e.message) || String(e));
  } finally {
    signal.removeEventListener("abort", onAbort);
  }
  if (signal.aborted) throw new Error("Request cancelled.");
  if (!(buf instanceof ArrayBuffer)) buf = new Uint8Array(buf).buffer;
  const metaLen = new DataView(buf).getUint32(0);
  const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, metaLen)));
  if (meta.error) {
    const err = new Error(meta.error);
    err.kind = meta.errorKind;   // "timeout" | "cancelled" | "network"
    throw err;
  }
  const bodyBytes = new Uint8Array(buf, 4 + metaLen);
  const headersList = Array.isArray(meta.headers) ? meta.headers : [];
  const ctPair = headersList.find(p => p[0].toLowerCase() === "content-type");
  const ct = ctPair ? ctPair[1] : "";
  return {
    status: meta.status,
    statusText: meta.statusText || "",
    headersList,
    finalUrl: meta.url || r.url,
    redirected: !!meta.redirected,
    contentType: ct,
    blob: new Blob([bodyBytes], { type: ct }),
  };
}

// Clipboard and file saving go through the native core when available —
// webviews don't reliably allow either from page script.
async function copyText(text) {
  const core = tauriCore();
  if (core) { try { await core.invoke("copy_text", { text }); return true; } catch { /* fall through */ } }
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}
async function saveBlob(blob, filename) {
  const core = tauriCore();
  if (core) {
    try {
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const path = await core.invoke("save_file", { suggestedName: filename, dataB64: b64FromBytes(bytes) });
      return !!path;
    } catch (e) { toast(typeof e === "string" ? e : "Could not save file", "err"); return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return true;
}

const inFlight = new Map(); // tabId -> { controller, timer, token }

function releaseResponse(resp) {
  if (resp && resp._imgUrl) { try { URL.revokeObjectURL(resp._imgUrl); } catch {} }
}

function updateSendUI() {
  const sending = inFlight.has(state.activeTabId);
  $("#btn-send").classList.toggle("sending", sending);
  $("#send-label").textContent = sending ? "Cancel" : "Send";
}

async function sendRequest() {
  const tab = activeTab();
  const existing = inFlight.get(tab.id);
  if (existing) {
    existing.controller.abort("cancelled");
    return;
  }
  const r = buildResolvedRequest(tab);
  if (!r.url) { toast("Enter a URL first", "err"); $("#url-input").focus(); return; }

  const controller = new AbortController();
  const timeoutSec = Number(state.settings.timeoutSec) || 0;
  const timer = timeoutSec > 0 ? setTimeout(() => controller.abort("timeout"), timeoutSec * 1000) : null;
  const token = uid();
  // is this request still the one the tab is waiting on? (guards against a
  // cancelled request's late rejection clobbering a newer request's state)
  const isCurrent = () => { const cur = inFlight.get(tab.id); return !!cur && cur.token === token; };
  inFlight.set(tab.id, { controller, timer, token });
  updateSendUI();
  releaseResponse(tab.response);
  tab.response = { loading: true };
  renderResponse();

  let body;
  if (r.bodyKind === "json" || r.bodyKind === "text" || r.bodyKind === "xml") body = r.bodyText;
  else if (r.bodyKind === "form") {
    const p = new URLSearchParams();
    r.formRows.forEach(row => p.append(row.key, row.value));
    body = p.toString();
  } else if (r.bodyKind === "multipart") {
    const fd = new FormData();
    r.formRows.forEach(row => {
      if (row.type === "file" && row._file) fd.append(row.key, row._file);
      else fd.append(row.key, row.value);
    });
    body = fd;
  }

  const viaNative = isNativeApp();
  const t0 = performance.now();
  try {
    const info = viaNative
      ? await sendViaTauri(r, body, controller.signal)
      : await sendDirect(r, body, controller.signal);
    const durationMs = performance.now() - t0;
    const contentType = info.contentType || "";
    let bodyFullText = "";
    const isTextual = !contentType || /json|text|xml|html|javascript|csv|urlencoded|svg|yaml|graphql/i.test(contentType);
    if (isTextual) { try { bodyFullText = await info.blob.text(); } catch { bodyFullText = ""; } }
    const truncated = bodyFullText.length > MAX_DISPLAY_CHARS;

    if (isCurrent()) {
      releaseResponse(tab.response);
      tab.response = {
        ok: info.status >= 200 && info.status < 300,
        status: info.status,
        statusText: info.statusText || STATUS_TEXT[info.status] || "",
        headers: info.headersList,
        finalUrl: info.finalUrl,
        redirected: info.redirected,
        durationMs,
        size: info.blob.size,
        contentType,
        isTextual,
        bodyText: truncated ? bodyFullText.slice(0, MAX_DISPLAY_CHARS) : bodyFullText,
        truncated,
        engine: viaNative ? "native" : "browser",
        _blob: info.blob,
      };
      tab.respTab = "body";
      pushHistory(tab, { status: info.status, durationMs });
    }
  } catch (err) {
    const durationMs = performance.now() - t0;
    const reason = controller.signal.aborted ? (controller.signal.reason || "cancelled") : null;
    // the abort reason wins; otherwise trust the engine's own classification
    const kind = reason === "timeout" ? "timeout"
      : reason ? "cancelled"
      : (err && (err.kind === "timeout" || err.kind === "cancelled")) ? err.kind
      : "network";
    if (isCurrent()) {
      releaseResponse(tab.response);
      tab.response = {
        error: {
          kind,
          message: err && err.message ? err.message : String(err),
        },
        durationMs,
        engine: viaNative ? "native" : "browser",
        requestUrl: r.url,
      };
      if (kind === "network") pushHistory(tab, { status: 0, durationMs });
    }
  } finally {
    if (timer) clearTimeout(timer);
    if (isCurrent()) inFlight.delete(tab.id);
    updateSendUI();
    if (state.activeTabId === tab.id) renderResponse();
    renderSidebar();
    persist();
  }
}

function snapshotRequest(tab) {
  return {
    name: tab.name,
    method: tab.method,
    url: tab.url,
    params: clone(tab.params),
    headers: clone(tab.headers),
    bodyType: tab.bodyType,
    bodyContent: tab.bodyContent,
    formData: (tab.formData || []).map(r => { const { _file, ...rest } = r; return rest; }),
    auth: clone(tab.auth),
  };
}
function pushHistory(tab, meta) {
  state.history.unshift({
    id: uid(),
    ts: Date.now(),
    method: tab.method,
    url: tab.url,
    status: meta.status,
    durationMs: meta.durationMs,
    snapshot: snapshotRequest(tab),
  });
  if (state.history.length > MAX_HISTORY) state.history.length = MAX_HISTORY;
}

/* ---------------- response rendering ---------------- */
function statusClass(status) {
  if (!status) return "status-err";
  if (status < 300) return "status-2xx";
  if (status < 400) return "status-3xx";
  if (status < 500) return "status-4xx";
  return "status-5xx";
}

function renderResponse() {
  const tab = activeTab();
  const panel = $("#response-panel");
  panel.innerHTML = "";
  const resp = tab.response;

  if (!resp) {
    const empty = document.createElement("div");
    empty.className = "resp-empty";
    empty.innerHTML = `
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".6">
        <path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 9h18M7 6.5h.01M9.5 6.5h.01"/>
      </svg>
      <div>Send a request to see the response here</div>
      <div class="kbd-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Ctrl</kbd>+<kbd>S</kbd> to save</div>`;
    panel.appendChild(empty);
    return;
  }

  if (resp.loading) {
    const empty = document.createElement("div");
    empty.className = "resp-empty";
    empty.innerHTML = `<div class="spin" style="font-size:22px">◌</div><div>Sending request…</div>`;
    panel.appendChild(empty);
    return;
  }

  if (resp.error) {
    const bar = document.createElement("div");
    bar.className = "resp-statusbar";
    const chip = document.createElement("span");
    chip.className = "status-chip status-err";
    chip.textContent = resp.error.kind === "timeout" ? "Timed out" : resp.error.kind === "cancelled" ? "Cancelled" : "Error";
    const meta = document.createElement("span");
    meta.className = "resp-meta";
    meta.innerHTML = `Time: <b>${fmtMs(resp.durationMs)}</b>`;
    bar.append(chip, meta);
    panel.appendChild(bar);

    const wrap = document.createElement("div");
    wrap.className = "resp-body-wrap";
    const card = document.createElement("div");
    card.className = "resp-error-card";
    const h = document.createElement("h3");
    const p = document.createElement("p");
    if (resp.error.kind === "timeout") {
      h.textContent = "Request timed out";
      p.textContent = `No response within ${state.settings.timeoutSec}s. You can raise the timeout in Settings.`;
    } else if (resp.error.kind === "cancelled") {
      h.textContent = "Request cancelled";
      p.textContent = "The request was cancelled before a response was received.";
    } else if (resp.engine === "native") {
      h.textContent = "Could not send request";
      p.innerHTML = `<code>${escHtml(resp.error.message)}</code><br><br>
        The request failed at the network level. Common causes:<br>
        • The host name doesn't resolve, or the server refused the connection.<br>
        • A TLS/certificate problem on the target server.<br>
        • The URL is invalid or the port isn't reachable.`;
    } else {
      h.textContent = "Could not send request";
      p.innerHTML = `<code>${escHtml(resp.error.message)}</code><br><br>
        The request failed. Common causes:<br>
        • Browser security restrictions on this page — running Whisper through its app avoids them.<br>
        • The host is unreachable, the connection was refused, or the URL is invalid.<br>
        • Calling an <code>http://</code> URL from an <code>https://</code> page.`;
    }
    card.append(h, p);
    wrap.appendChild(card);
    panel.appendChild(wrap);
    return;
  }

  /* status bar */
  const bar = document.createElement("div");
  bar.className = "resp-statusbar";
  const chip = document.createElement("span");
  chip.className = "status-chip " + statusClass(resp.status);
  chip.textContent = resp.status + (resp.statusText ? " " + resp.statusText : "");
  const timeMeta = document.createElement("span");
  timeMeta.className = "resp-meta";
  timeMeta.innerHTML = `Time: <b>${fmtMs(resp.durationMs)}</b>`;
  const sizeMeta = document.createElement("span");
  sizeMeta.className = "resp-meta";
  sizeMeta.innerHTML = `Size: <b>${fmtBytes(resp.size)}</b>`;
  bar.append(chip, timeMeta, sizeMeta);
  if (resp.redirected) {
    const rd = document.createElement("span");
    rd.className = "resp-meta";
    rd.title = resp.finalUrl;
    rd.innerHTML = `↪ redirected`;
    bar.appendChild(rd);
  }
  const actions = document.createElement("div");
  actions.className = "resp-actions";
  const copyBtn = mkBtn("Copy", "btn-ghost", async () => {
    if (await copyText(resp.bodyText || "")) toast("Response copied"); else toast("Copy failed", "err");
  });
  copyBtn.style.padding = "5px 12px";
  const dlBtn = mkBtn(isNativeApp() ? "Save…" : "Download", "btn-ghost", () => downloadResponse(resp));
  dlBtn.style.padding = "5px 12px";
  actions.append(copyBtn, dlBtn);
  bar.appendChild(actions);
  panel.appendChild(bar);

  /* tabs */
  const tabs = document.createElement("div");
  tabs.className = "resp-tabs";
  [["body", "Body"], ["headers", `Headers (${resp.headers.length})`]].forEach(([val, label]) => {
    const b = document.createElement("button");
    b.className = "req-tab" + (tab.respTab === val ? " active" : "");
    b.textContent = label;
    b.addEventListener("click", () => { tab.respTab = val; renderResponse(); });
    tabs.appendChild(b);
  });
  if (tab.respTab === "body" && resp.isTextual && resp.bodyText) {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.style.marginLeft = "auto";
    seg.style.margin = "4px 0 4px auto";
    const views = [["pretty", "Pretty"], ["raw", "Raw"]];
    if (/html|image|svg/i.test(resp.contentType)) views.push(["preview", "Preview"]);
    // a view kept from a previous response (e.g. Preview) may not apply here
    if (!views.some(([v]) => v === tab.respView)) tab.respView = "pretty";
    views.forEach(([v, l]) => {
      const b = document.createElement("button");
      b.textContent = l;
      b.classList.toggle("active", tab.respView === v);
      b.addEventListener("click", () => { tab.respView = v; renderResponse(); });
      seg.appendChild(b);
    });
    tabs.appendChild(seg);
  }
  panel.appendChild(tabs);

  const wrap = document.createElement("div");
  wrap.className = "resp-body-wrap";
  panel.appendChild(wrap);

  if (resp.truncated) {
    const note = document.createElement("div");
    note.className = "trunc-note";
    note.textContent = `Large response — showing the first ${fmtBytes(MAX_DISPLAY_CHARS)} of text. Use Download for the full body.`;
    wrap.appendChild(note);
  }

  if (tab.respTab === "headers") {
    const table = document.createElement("table");
    table.className = "resp-headers-table";
    resp.headers.forEach(([k, v]) => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td");
      td1.textContent = k;
      const td2 = document.createElement("td");
      td2.textContent = v;
      tr.append(td1, td2);
      table.appendChild(tr);
    });
    wrap.appendChild(table);
    if (resp.engine !== "native") {
      const hint = document.createElement("div");
      hint.className = "body-note";
      hint.style.padding = "10px 16px";
      hint.textContent = "Note: in browser mode some response headers may be hidden by the browser. The Whisper app shows them all.";
      wrap.appendChild(hint);
    }
    return;
  }

  /* body views */
  const isImage = /^image\//i.test(resp.contentType) && !/svg/i.test(resp.contentType);
  if (isImage) {
    const d = document.createElement("div");
    d.className = "preview-img-wrap";
    const img = document.createElement("img");
    if (!resp._imgUrl) resp._imgUrl = URL.createObjectURL(resp._blob);
    img.src = resp._imgUrl;
    d.appendChild(img);
    wrap.appendChild(d);
    return;
  }
  if (!resp.isTextual) {
    const d = document.createElement("div");
    d.className = "resp-empty";
    d.style.padding = "30px";
    d.innerHTML = `<div>Binary response (<b>${escHtml(resp.contentType || "unknown type")}</b>, ${fmtBytes(resp.size)})</div>`;
    const dl = mkBtn(isNativeApp() ? "Save response…" : "Download response", "btn-primary", () => downloadResponse(resp));
    d.appendChild(dl);
    wrap.appendChild(d);
    return;
  }
  if (!resp.bodyText) {
    const d = document.createElement("div");
    d.className = "resp-empty";
    d.innerHTML = "<div>Empty response body</div>";
    wrap.appendChild(d);
    return;
  }

  if (tab.respView === "preview" && /html|svg/i.test(resp.contentType)) {
    const iframe = document.createElement("iframe");
    iframe.className = "preview-frame";
    iframe.sandbox = "";
    iframe.srcdoc = resp.bodyText;
    wrap.appendChild(iframe);
    return;
  }

  const pre = document.createElement("pre");
  pre.className = "resp-pre";
  let shownAsJson = false;
  if (tab.respView === "pretty" && !resp.truncated) {
    try {
      const parsed = JSON.parse(resp.bodyText);
      pre.innerHTML = highlightJSON(JSON.stringify(parsed, null, 2));
      shownAsJson = true;
    } catch { /* not JSON */ }
  }
  if (!shownAsJson) pre.textContent = resp.bodyText;
  wrap.appendChild(pre);
}

function highlightJSON(jsonStr) {
  const e = escHtml(jsonStr);
  return e.replace(
    /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m) => {
      let cls = "num";
      if (m[0] === '"') cls = /:\s*$/.test(m) || m.endsWith(":") ? "key" : "str";
      else if (m === "true" || m === "false") cls = "bool";
      else if (m === "null") cls = "null";
      return `<span class="tok-${cls}">${m}</span>`;
    }
  );
}

function extFromContentType(ct) {
  if (/json/i.test(ct)) return ".json";
  if (/html/i.test(ct)) return ".html";
  if (/xml/i.test(ct)) return ".xml";
  if (/csv/i.test(ct)) return ".csv";
  if (/png/i.test(ct)) return ".png";
  if (/jpe?g/i.test(ct)) return ".jpg";
  if (/gif/i.test(ct)) return ".gif";
  if (/svg/i.test(ct)) return ".svg";
  if (/pdf/i.test(ct)) return ".pdf";
  if (/plain/i.test(ct)) return ".txt";
  return "";
}
async function downloadResponse(resp) {
  if (!resp._blob) { toast("Nothing to save", "err"); return; }
  const ok = await saveBlob(resp._blob, "response" + extFromContentType(resp.contentType));
  if (ok && isNativeApp()) toast("Response saved");
}

/* ---------------- sidebar ---------------- */
function renderSidebar() {
  $$(".sb-tab").forEach(b => b.classList.toggle("active", b.dataset.sbtab === state.sidebarTab));
  const toolbar = $("#sb-toolbar");
  const content = $("#sb-content");
  toolbar.innerHTML = "";
  content.innerHTML = "";

  if (state.sidebarTab === "collections") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "Collections";
    const add = document.createElement("button");
    add.className = "text-btn";
    add.textContent = "+ New";
    add.addEventListener("click", () => {
      promptModal("New collection", "Collection name", "", (name) => {
        state.collections.push({ id: uid(), name, open: true, requests: [] });
        renderSidebar(); persist();
      }, "Create");
    });
    toolbar.append(label, add);

    if (!state.collections.length) {
      const d = document.createElement("div");
      d.className = "empty-state";
      d.innerHTML = "No collections yet.<br>Save a request (Ctrl+S) or create a collection to organize your APIs.";
      content.appendChild(d);
      return;
    }

    state.collections.forEach(col => {
      const folder = document.createElement("div");
      folder.className = "col-folder" + (col.open ? " open" : "");

      const head = document.createElement("div");
      head.className = "col-folder-head";
      const chev = document.createElement("span");
      chev.className = "chev";
      chev.textContent = "▶";
      const fname = document.createElement("span");
      fname.className = "fname";
      fname.textContent = col.name;
      fname.title = "Double-click to rename";
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = col.requests.length;
      const del = document.createElement("button");
      del.className = "row-del";
      del.innerHTML = "×";
      del.title = "Delete collection";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        confirmModal("Delete collection", `Delete "${col.name}" and its ${col.requests.length} request(s)? This cannot be undone.`, () => {
          state.collections = state.collections.filter(c => c.id !== col.id);
          state.tabs.forEach(t => { if (t.savedRef && t.savedRef.colId === col.id) t.savedRef = null; });
          renderSidebar(); persist();
        });
      });
      head.append(chev, fname, count, del);
      const toggleOpen = () => { col.open = !col.open; renderSidebar(); persist(); };
      head.addEventListener("click", toggleOpen);
      makeActivatable(head, toggleOpen);
      head.addEventListener("dblclick", (e) => {
        e.stopPropagation();
        promptModal("Rename collection", "Collection name", col.name, (name) => {
          col.name = name; renderSidebar(); persist();
        }, "Rename");
      });
      folder.appendChild(head);

      const reqs = document.createElement("div");
      reqs.className = "col-reqs";
      col.requests.forEach(req => {
        const item = document.createElement("div");
        item.className = "req-item";
        const chipEl = document.createElement("span");
        chipEl.className = "method-chip m-" + req.req.method;
        chipEl.textContent = req.req.method;
        const rn = document.createElement("span");
        rn.className = "rname";
        rn.textContent = req.name;
        rn.title = req.req.url;
        const rdel = document.createElement("button");
        rdel.className = "row-del";
        rdel.innerHTML = "×";
        rdel.title = "Delete request";
        rdel.addEventListener("click", (e) => {
          e.stopPropagation();
          col.requests = col.requests.filter(r => r.id !== req.id);
          state.tabs.forEach(t => { if (t.savedRef && t.savedRef.reqId === req.id) t.savedRef = null; });
          renderSidebar(); persist();
        });
        item.append(chipEl, rn, rdel);
        item.addEventListener("click", () => openSavedRequest(col, req));
        makeActivatable(item, () => openSavedRequest(col, req));
        reqs.appendChild(item);
      });
      if (!col.requests.length) {
        const d = document.createElement("div");
        d.className = "body-note";
        d.style.paddingLeft = "24px";
        d.textContent = "Empty — save a request here.";
        reqs.appendChild(d);
      }
      folder.appendChild(reqs);
      content.appendChild(folder);
    });
  } else {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "History";
    toolbar.appendChild(label);
    if (state.history.length) {
      const clear = document.createElement("button");
      clear.className = "text-btn danger";
      clear.textContent = "Clear";
      clear.addEventListener("click", () => {
        confirmModal("Clear history", "Remove all request history? This cannot be undone.", () => {
          state.history = []; renderSidebar(); persist();
        }, "Clear");
      });
      toolbar.appendChild(clear);
    }

    if (!state.history.length) {
      const d = document.createElement("div");
      d.className = "empty-state";
      d.innerHTML = "No requests yet.<br>Everything you send shows up here.";
      content.appendChild(d);
      return;
    }

    state.history.forEach(h => {
      const item = document.createElement("div");
      item.className = "hist-item";
      const chipEl = document.createElement("span");
      chipEl.className = "method-chip m-" + h.method;
      chipEl.textContent = h.method;
      const main = document.createElement("div");
      main.className = "hist-main";
      const u = document.createElement("div");
      u.className = "hist-url";
      u.textContent = h.url;
      u.title = h.url;
      const meta = document.createElement("div");
      meta.className = "hist-meta";
      const st = document.createElement("span");
      st.className = "hist-status " + (h.status ? (h.status < 400 ? "" : "") : "");
      st.style.color = h.status === 0 ? "var(--danger)" : h.status < 300 ? "var(--ok)" : h.status < 400 ? "var(--warn)" : "var(--danger)";
      st.textContent = h.status === 0 ? "ERR" : h.status;
      meta.append(st, document.createTextNode(` · ${fmtMs(h.durationMs)} · ${timeAgo(h.ts)}`));
      main.append(u, meta);
      const del = document.createElement("button");
      del.className = "row-del";
      del.innerHTML = "×";
      del.title = "Remove";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        state.history = state.history.filter(x => x.id !== h.id);
        renderSidebar(); persist();
      });
      item.append(chipEl, main, del);
      const loadFromHistory = () => {
        addTab(Object.assign(clone(h.snapshot), { savedRef: null }));
        toast("Loaded from history");
      };
      item.addEventListener("click", loadFromHistory);
      makeActivatable(item, loadFromHistory);
      content.appendChild(item);
    });
  }
}

function openSavedRequest(col, req) {
  // if already open in a tab, switch to it
  const existing = state.tabs.find(t => t.savedRef && t.savedRef.reqId === req.id);
  if (existing) { switchTab(existing.id); return; }
  addTab(Object.assign(clone(req.req), { name: req.name, savedRef: { colId: col.id, reqId: req.id } }));
}

$$(".sb-tab").forEach(b => b.addEventListener("click", () => {
  state.sidebarTab = b.dataset.sbtab;
  renderSidebar(); persist();
}));

/* ---------------- save to collection ---------------- */
function openSaveModal() {
  const tab = activeTab();
  const wrap = document.createElement("div");

  const nameRow = document.createElement("div");
  nameRow.className = "form-row";
  const nameLab = document.createElement("label");
  nameLab.textContent = "Request name";
  const nameInput = document.createElement("input");
  nameInput.type = "text";
  nameInput.value = tab.name || tabDisplayName(tab);
  nameRow.append(nameLab, nameInput);

  const colRow = document.createElement("div");
  colRow.className = "form-row";
  const colLab = document.createElement("label");
  colLab.textContent = "Collection";
  const colSel = document.createElement("select");
  state.collections.forEach(c => {
    const o = document.createElement("option");
    o.value = c.id; o.textContent = c.name;
    colSel.appendChild(o);
  });
  const newOpt = document.createElement("option");
  newOpt.value = "__new__"; newOpt.textContent = "＋ Create new collection…";
  colSel.appendChild(newOpt);
  if (tab.savedRef && state.collections.some(c => c.id === tab.savedRef.colId)) colSel.value = tab.savedRef.colId;
  else if (!state.collections.length) colSel.value = "__new__";

  const newColRow = document.createElement("div");
  newColRow.className = "form-row";
  const newColLab = document.createElement("label");
  newColLab.textContent = "New collection name";
  const newColInput = document.createElement("input");
  newColInput.type = "text"; newColInput.placeholder = "My API";
  newColRow.append(newColLab, newColInput);
  const syncNewVis = () => { newColRow.style.display = colSel.value === "__new__" ? "" : "none"; };
  colSel.addEventListener("change", syncNewVis);

  colRow.append(colLab, colSel);
  wrap.append(nameRow, colRow, newColRow);
  syncNewVis();

  const doSave = () => {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    let col;
    if (colSel.value === "__new__") {
      const cn = newColInput.value.trim();
      if (!cn) { newColInput.focus(); return; }
      col = { id: uid(), name: cn, open: true, requests: [] };
      state.collections.push(col);
    } else {
      col = state.collections.find(c => c.id === colSel.value);
      if (!col) return;
    }
    tab.name = name;
    const snap = snapshotRequest(tab);
    snap.name = name;

    closeModal();
    renderAll(); persistNow();

/* ---------------- code generation ---------------- */
function shq(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
function jsq(s) { return JSON.stringify(String(s)); }
function pyq(s) { return JSON.stringify(String(s)); }

function genCurl(r) {
  const lines = ["curl -X " + r.method + " " + shq(r.url)];
  Object.entries(r.headers).forEach(([k, v]) => lines.push("  -H " + shq(k + ": " + v)));
  if (["json", "text", "xml"].includes(r.bodyKind)) {
    lines.push("  --data-raw " + shq(r.bodyText));
  } else if (r.bodyKind === "form") {
    const p = new URLSearchParams();
    r.formRows.forEach(row => p.append(row.key, row.value));
    lines.push("  --data " + shq(p.toString()));
  } else if (r.bodyKind === "multipart") {
    r.formRows.forEach(row => {
      lines.push("  -F " + shq(row.key + (row.type === "file" ? "=@" + (row._file ? row._file.name : "file") : "=" + row.value)));
    });
  }
  return lines.join(" \\\n");
}
function genFetch(r) {
  const opts = { method: r.method };
  const lines = [];
  lines.push(`const response = await fetch(${jsq(r.url)}, {`);
  lines.push(`  method: ${jsq(r.method)},`);
  const hk = Object.entries(r.headers);
  if (hk.length) {
    lines.push("  headers: {");
    hk.forEach(([k, v]) => lines.push(`    ${jsq(k)}: ${jsq(v)},`));
    lines.push("  },");
  }
  if (["json", "text", "xml"].includes(r.bodyKind)) {
    lines.push(`  body: ${jsq(r.bodyText)},`);
  } else if (r.bodyKind === "form") {
    const p = new URLSearchParams();
    r.formRows.forEach(row => p.append(row.key, row.value));
    lines.push(`  body: ${jsq(p.toString())},`);
  } else if (r.bodyKind === "multipart") {
    lines.length = 0;
    lines.push("const form = new FormData();");
    r.formRows.forEach(row => {
      if (row.type === "file") lines.push(`form.append(${jsq(row.key)}, fileInput.files[0]); // attach your file`);
      else lines.push(`form.append(${jsq(row.key)}, ${jsq(row.value)});`);
    });
    lines.push("");
    lines.push(`const response = await fetch(${jsq(r.url)}, {`);
    lines.push(`  method: ${jsq(r.method)},`);
    if (hk.length) {
      lines.push("  headers: {");
      hk.forEach(([k, v]) => lines.push(`    ${jsq(k)}: ${jsq(v)},`));
      lines.push("  },");
    }
    lines.push("  body: form,");
  }
  lines.push("});");
  lines.push("const data = await response.json();");
  lines.push("console.log(data);");
  return lines.join("\n");
}
// emit a real Python literal by walking the parsed value — a text-replace of
// true/false/null would also corrupt string values containing those words
function pyLiteral(v, indent) {
  const pad = " ".repeat(indent), pad2 = " ".repeat(indent + 4);
  if (v === null) return "None";
  if (v === true) return "True";
  if (v === false) return "False";
  if (typeof v === "number") return Number.isFinite(v) ? String(v) : "None";
  if (typeof v === "string") return pyq(v);
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return "[\n" + v.map(x => pad2 + pyLiteral(x, indent + 4)).join(",\n") + "\n" + pad + "]";
  }
  const keys = Object.keys(v);
  if (!keys.length) return "{}";
  return "{\n" + keys.map(k => pad2 + pyq(k) + ": " + pyLiteral(v[k], indent + 4)).join(",\n") + "\n" + pad + "}";
}

function genPython(r) {
  const lines = ["import requests", ""];
  lines.push(`url = ${pyq(r.url)}`);
  const hk = Object.entries(r.headers);
  if (hk.length) {
    lines.push("headers = {");
    hk.forEach(([k, v]) => lines.push(`    ${pyq(k)}: ${pyq(v)},`));
    lines.push("}");
  }
  let dataArg = "";
  if (r.bodyKind === "json") {
    let parsed, parseOk = false;
    try { parsed = JSON.parse(r.bodyText); parseOk = true; } catch {}
    if (parseOk) {
      lines.push("payload = " + pyLiteral(parsed, 0));
      dataArg = ", json=payload";
    } else {
      lines.push(`payload = ${pyq(r.bodyText)}`);
      dataArg = ", data=payload";
    }
  } else if (["text", "xml"].includes(r.bodyKind)) {
    lines.push(`payload = ${pyq(r.bodyText)}`);
    dataArg = ", data=payload";
  } else if (r.bodyKind === "form") {
    lines.push("payload = {");
    r.formRows.forEach(row => lines.push(`    ${pyq(row.key)}: ${pyq(row.value)},`));
    lines.push("}");
    dataArg = ", data=payload";
  } else if (r.bodyKind === "multipart") {
    lines.push("files = {");
    r.formRows.forEach(row => {
      if (row.type === "file") lines.push(`    ${pyq(row.key)}: open(${pyq(row._file ? row._file.name : "file.bin")}, "rb"),`);
      else lines.push(`    ${pyq(row.key)}: (None, ${pyq(row.value)}),`);
    });
    lines.push("}");
    dataArg = ", files=files";
  }
  lines.push("");
  lines.push(`response = requests.request(${pyq(r.method)}, url${hk.length ? ", headers=headers" : ""}${dataArg})`);
  lines.push("print(response.status_code)");
  lines.push("print(response.text)");
  return lines.join("\n");
}

/* ---------------- cURL import ---------------- */
function tokenizeCurl(s) {
  const tokens = [];
  let cur = "", i = 0, q = null, ansi = false;
  const ANSI_ESC = { n: "\n", t: "\t", r: "\r", a: "\x07", b: "\b", f: "\f", v: "\v", "0": "\0", "\\": "\\", "'": "'", '"': '"' };
  s = s.replace(/\\\r?\n/g, " ").replace(/\^\r?\n/g, " ").trim();
  // Chrome's "Copy as cURL (cmd)" escapes with carets (^"...^", \^" for inner
  // quotes) — un-escape them so the normal quote handling below applies
  if (/\^"/.test(s)) s = s.replace(/\^(.)/g, "$1");
  while (i < s.length) {
    const c = s[i];
    if (ansi) { // ANSI-C $'...' quoting
      if (c === "'") ansi = false;
      else if (c === "\\" && i + 1 < s.length) {
        const n = s[++i];
        if (n === "x" && /^[0-9a-fA-F]{2}/.test(s.slice(i + 1))) { cur += String.fromCharCode(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
        else if (n === "u" && /^[0-9a-fA-F]{4}/.test(s.slice(i + 1))) { cur += String.fromCharCode(parseInt(s.substr(i + 1, 4), 16)); i += 4; }
        else cur += (n in ANSI_ESC ? ANSI_ESC[n] : "\\" + n);
      }
      else cur += c;
    } else if (q) {
      if (c === q) { q = null; }
      else if (c === "\\" && q === '"' && i + 1 < s.length) { cur += s[++i]; }
      else cur += c;
    } else if (c === "$" && s[i + 1] === "'") {
      ansi = true; i++;
    } else if (c === "'" || c === '"') {
      q = c;
    } else if (/\s/.test(c)) {
      if (cur !== "") { tokens.push(cur); cur = ""; }
    } else if (c === "\\" && i + 1 < s.length) {
      cur += s[++i];
    } else {
      cur += c;
    }
    i++;
  }
  if (cur !== "") tokens.push(cur);
  return tokens;
}
function parseCurl(cmd) {
  const tokens = tokenizeCurl(cmd);
  if (!tokens.length) return null;
  if (/^curl$/i.test(tokens[0])) tokens.shift();

  const out = { method: "", url: "", headers: [], body: "", form: [], auth: null };
  let i = 0;
  const next = () => tokens[++i];
  while (i < tokens.length) {
    const t = tokens[i];
    if (t === "-X" || t === "--request") out.method = (next() || "GET").toUpperCase();
    else if (t === "-H" || t === "--header") {
      const h = next() || "";
      const ci = h.indexOf(":");
      if (ci > 0) out.headers.push({ enabled: true, key: h.slice(0, ci).trim(), value: h.slice(ci + 1).trim() });
    }
    else if (["-d", "--data", "--data-raw", "--data-binary", "--data-ascii", "--json"].includes(t)) {
      const d = next() || "";
      out.body = out.body ? out.body + "&" + d : d; // curl joins repeated -d with &
      if (t === "--json") out.headers.push({ enabled: true, key: "Content-Type", value: "application/json" });
    }
    else if (t === "--data-urlencode") {
      const v = next() || "";
      const ei0 = v.indexOf("=");
      const enc = ei0 >= 0 ? v.slice(0, ei0) + "=" + encodeURIComponent(v.slice(ei0 + 1)) : encodeURIComponent(v);
      out.body = out.body ? out.body + "&" + enc : enc;
      out.urlencoded = true;
    }
    else if (t === "-F" || t === "--form") {
      const f = next() || "";
      const ei = f.indexOf("=");
      if (ei > 0) {
        const val = f.slice(ei + 1);
        out.form.push({ enabled: true, key: f.slice(0, ei), value: val.startsWith("@") ? "" : val, type: val.startsWith("@") ? "file" : "text" });
      }
    }
    else if (t === "-u" || t === "--user") {
      const u = next() || "";
      const ci2 = u.indexOf(":");
      out.auth = { type: "basic", username: ci2 >= 0 ? u.slice(0, ci2) : u, password: ci2 >= 0 ? u.slice(ci2 + 1) : "" };
    }
    else if (t === "--url") out.url = next() || "";
    else if (t === "-L" || t === "--location" || t === "--compressed" || t === "-s" || t === "--silent" || t === "-k" || t === "--insecure" || t === "-i" || t === "--include" || t === "-v" || t === "--verbose") { /* ignore */ }
    else if (t === "-A" || t === "--user-agent") out.headers.push({ enabled: true, key: "User-Agent", value: next() || "" });
    else if (t === "-e" || t === "--referer") out.headers.push({ enabled: true, key: "Referer", value: next() || "" });
    else if (t === "-b" || t === "--cookie") out.headers.push({ enabled: true, key: "Cookie", value: next() || "" });
    else if (t === "-o" || t === "--output" || t === "-m" || t === "--max-time" || t === "--connect-timeout") next();
    else if (!t.startsWith("-") && !out.url) out.url = t;
    i++;
  }
  if (!out.url) return null;
  if (!out.method) out.method = (out.body || out.form.length) ? "POST" : "GET";

  const tabData = {
    method: ["GET","POST","PUT","PATCH","DELETE","HEAD","OPTIONS"].includes(out.method) ? out.method : "GET",
    url: out.url,
    headers: out.headers,
    params: [],
    bodyType: "none",
    bodyContent: "",
    formData: [],
  };
  syncParamsFromUrl(tabData);
  if (out.form.length) {
    tabData.bodyType = "multipart";
    tabData.formData = out.form;
  } else if (out.body) {
    if (out.urlencoded) tabData.bodyType = "form";
    else {
      try { JSON.parse(out.body); tabData.bodyType = "json"; }
      catch {
        const ct = out.headers.find(h => h.key.toLowerCase() === "content-type");
        tabData.bodyType = ct && /urlencoded/i.test(ct.value) ? "form" : "text";
      }
    }
    if (tabData.bodyType === "form") {
      tabData.formData = parseQueryString(out.body).map(p => ({ ...p, type: "text" }));
      tabData.bodyContent = "";
    } else {
      tabData.bodyContent = out.body;
    }
  }
  if (out.auth) tabData.auth = Object.assign(newTab({}).auth, out.auth);
  return tabData;
}

$("#btn-import").addEventListener("click", openImportModal);

$("#import-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || (typeof data !== "object")) throw new Error("bad format");
      let nCols = 0, nEnvs = 0;
      (Array.isArray(data.collections) ? data.collections : []).forEach(c => {
        const col = { id: uid(), name: String(c.name || "Imported"), open: false, requests: [] };
        (Array.isArray(c.requests) ? c.requests : []).forEach(r => {
          if (r && r.req && r.req.url != null) {
            const base = newTab(r.req);
            col.requests.push({ id: uid(), name: String(r.name || "Request"), req: snapshotRequest(base) });
          }
        });
        state.collections.push(col);
        nCols++;
      });
      (Array.isArray(data.environments) ? data.environments : []).forEach(en => {
        state.environments.push({
          id: uid(),
          name: String(en.name || "Imported env"),
          vars: (Array.isArray(en.vars) ? en.vars : []).map(v => ({ enabled: v.enabled !== false, key: String(v.key || ""), value: String(v.value || "") })),
        });
        nEnvs++;
      });
      if (!nCols && !nEnvs) { toast("Nothing to import in that file", "err"); return; }
      closeModal();
      renderSidebar(); renderEnvSelect(); persist();
      toast(`Imported ${nCols} collection(s), ${nEnvs} environment(s)`);
    } catch {
      toast("Invalid import file", "err");
    }
  };
  reader.readAsText(file);
});

$("#btn-export").addEventListener("click", () => {
  if (!state.collections.length && !state.environments.length) {
    toast("Nothing to export yet", "err");
    return;
  }
  const data = {
    app: "whisper",
    version: 1,
    exportedAt: new Date().toISOString(),
    collections: state.collections,
    environments: state.environments,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  saveBlob(blob, "whisper-export.json").then(ok => { if (ok) toast("Exported collections & environments"); });
});

  const dangerRow = document.createElement("div");
  dangerRow.className = "form-row";
  const dangerLab = document.createElement("label");
  dangerLab.textContent = "Danger zone";
  const clearBtn = mkBtn("Erase all Whisper data", "btn-ghost", () => {
    confirmModal("Erase everything", "Delete all tabs, collections, history, environments and settings stored in this browser?", () => {
      try { localStorage.removeItem(LS_KEY); } catch {}
      location.reload();
    }, "Erase");
  });
  clearBtn.style.color = "var(--danger)";
  clearBtn.style.borderColor = "var(--danger)";
  dangerRow.append(dangerLab, clearBtn);

  const about = document.createElement("p");
  about.style.cssText = "color:var(--text-faint);font-size:11.5px;line-height:1.6;margin-top:16px";
  about.textContent = "Whisper is a self-contained REST client. Everything is stored locally in your browser (localStorage) — nothing leaves your machine except the requests you send.";

  wrap.append(toRow, themeRow, dangerRow, about);

  openModal({
    title: "Settings", body: wrap,
    foot: [mkBtn("Cancel", "btn-ghost", closeModal), mkBtn("Save", "btn-primary", () => {
      const n = parseInt(toInput.value, 10);
      state.settings.timeoutSec = Number.isFinite(n) && n >= 0 ? n : 30;
      state.settings.theme = themeSel.value;
      applyTheme(); persistNow(); closeModal();
      toast("Settings saved");
    })],
  });
}
$("#btn-settings").addEventListener("click", openSettingsModal);

/* ---------------- top-level events ---------------- */
$("#method-select").addEventListener("change", (e) => {
  const tab = activeTab();
  tab.method = e.target.value;
  renderTabbar(); renderRequestPanel(); persist();
});
$("#url-input").addEventListener("input", (e) => {
  const tab = activeTab();
  tab.url = e.target.value;
  syncParamsFromUrl(tab);
  if (tab.reqTab === "params") renderRequestPanel();
  else updateBadges();
  renderTabbar(); persist();
});
$("#url-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendRequest();
});
$$(".req-tab").forEach(b => b.addEventListener("click", () => {
  activeTab().reqTab = b.dataset.reqtab;
  renderRequestPanel(); persist();
}));
$("#btn-send").addEventListener("click", sendRequest);
$("#btn-save").addEventListener("click", openSaveModal);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (openModalEl) closeModal(); return; }
  if (openModalEl) return; // don't send/save behind an open modal
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === "Enter") { e.preventDefault(); sendRequest(); }
  else if (mod && (e.key === "s" || e.key === "S")) { e.preventDefault(); openSaveModal(); }
});

/* divider drag */
(function initDivider() {
  const divider = $("#divider");
  const area = $("#req-body-area");
  divider.addEventListener("mousedown", (e) => {
    e.preventDefault();
    const startY = e.clientY;
    const startH = area.getBoundingClientRect().height;
    const ws = $("#workspace").getBoundingClientRect();
    const onMove = (ev) => {
      const h = Math.min(Math.max(64, startH + (ev.clientY - startY)), ws.height - 220);
      area.style.height = h + "px";
    };
    const onUp = () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.body.style.cursor = "";
    };
    document.body.style.cursor = "row-resize";
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
})();

/* ---------------- init ---------------- */
function renderAll() {
  renderTabbar();
  renderRequestPanel();
  renderResponse();
  renderSidebar();
  updateSendUI();
}
applyTheme();
renderEnvSelect();
renderAll();
updateEngineChip();
</script>
</body>
</html>
